name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows bundles
    # Only Windows is built for now; that is the platform the artifacts are
    # named for below (x64 NSIS setup + WiX MSI).
    runs-on: windows-latest
    env:
      # `secrets` is not allowed in a step `if`, so the token is mapped here and
      # the signing steps key off this env var instead.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix apps/desktop ci

      - name: Build frontend
        run: npm --prefix apps/desktop run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Artifact names carry the Tauri config version, so a tag that disagrees
      # with it would publish a confusingly named release.
      - name: Check tag matches app version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          conf="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          pkg="$(node -p "require('./apps/desktop/package.json').version")"
          echo "tag=$tag tauri.conf=$conf package.json=$pkg"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match tauri.conf.json ($conf) / package.json ($pkg)"
            exit 1
          fi

      - name: cargo build --release
        run: cargo build --release

      # --- Updater signing key (optional) ---------------------------------
      # `secrets` cannot be used in a step `if`, so the presence of the key is
      # turned into an output and every updater step keys off it. Without the
      # secret the release stays exactly as before: unsigned bundles, no .sig
      # and no latest.json. See docs/UPDATER.md.
      - name: Detect updater signing key
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "TAURI_SIGNING_PRIVATE_KEY is set: building updater artifacts"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "no TAURI_SIGNING_PRIVATE_KEY: plain unsigned bundles, updater disabled"
          fi

      - name: Build Tauri bundles
        if: steps.updater.outputs.enabled != 'true'
        run: npm --prefix apps/desktop run tauri build

      # `createUpdaterArtifacts` is deliberately not in tauri.conf.json: it is
      # merged in here only when the key exists, so a normal build without a
      # key cannot fail. The key and its password come from repository secrets.
      - name: Build Tauri bundles with updater artifacts
        if: steps.updater.outputs.enabled == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat > updater-build.json <<'JSON'
          {"bundle":{"createUpdaterArtifacts":true}}
          JSON
          npm --prefix apps/desktop run tauri build -- --config "$GITHUB_WORKSPACE/updater-build.json"

      - name: Collect bundles and checksums
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p release-artifacts

          # Tauri writes bundles into the workspace target dir.
          setup="$(find target/release/bundle -type f -name "Brickman Torrent_${ver}_x64-setup.exe" 2>/dev/null | head -n 1 || true)"
          msi="$(find target/release/bundle -type f -name "Brickman Torrent_${ver}_x64_en-US.msi" 2>/dev/null | head -n 1 || true)"

          if [ -z "$setup" ] || [ -z "$msi" ]; then
            echo "::error::expected bundles for $ver not found (setup='$setup' msi='$msi')"
            exit 1
          fi

          cp "$setup" "$msi" release-artifacts/
          ( cd release-artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt )

      # --- Code signing (SignPath, free for OSS) --------------------------
      # Skipped entirely unless the owner adds SIGNPATH_API_TOKEN and the repo
      # variables SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG /
      # SIGNPATH_SIGNING_POLICY_SLUG / SIGNPATH_ARTIFACT_CONFIG_SLUG (see
      # docs/SIGNING.md). Without them the release publishes unsigned, as before.
      - name: Upload bundles for signing
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-bundles
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Submit signing request to SignPath
        id: sign
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # SignPath's OSS program requires a manual approval per release, so
      # wait-for-completion above pauses here until the owner approves in the
      # SignPath UI; the signing-request-web-url is printed in the step output.
      - name: Replace bundles with the signed copies
        if: steps.sign.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          # The action returns the signed files under `signed/` (a zip is
          # decompressed into that directory). Keep the exact filenames.
          if compgen -G "signed/*" > /dev/null; then
            cp -f signed/* release-artifacts/ 2>/dev/null || true
            rm -f release-artifacts/SHA256SUMS.txt
            ( cd release-artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt )
          else
            echo "::warning::no signed files found, publishing unsigned"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/Brickman Torrent_*_x64-setup.exe
            release-artifacts/Brickman Torrent_*_x64_en-US.msi
            release-artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true

      # --- Updater manifest (only with a signing key) ---------------------
      # Runs after SignPath replaced the bundles: Authenticode signing changes
      # the bytes of the setup, so the updater signature is made from the final
      # file and not from the one the bundler produced.
      - name: Sign the updater bundle and write latest.json
        if: steps.updater.outputs.enabled == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          setup="release-artifacts/Brickman Torrent_${ver}_x64-setup.exe"
          if [ ! -f "$setup" ]; then
            echo "::error::$setup not found, cannot create updater artifacts"
            exit 1
          fi
          # `tauri signer sign` writes `<file>.sig` next to the input.
          npm --prefix apps/desktop run tauri -- signer sign "$GITHUB_WORKSPACE/$setup"
          if [ ! -f "$setup.sig" ]; then
            echo "::error::tauri signer sign did not write $setup.sig"
            exit 1
          fi

          VERSION="$ver" SIG_FILE="$setup.sig" node -e '
          const fs = require("fs");
          const version = process.env.VERSION;
          const signature = fs.readFileSync(process.env.SIG_FILE, "utf8").trim();
          const file = "Brickman.Torrent_" + version + "_x64-setup.exe"; // GitHub stores the asset with the space as a dot
          const manifest = {
            version,
            pub_date: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
            platforms: {
              "windows-x86_64": {
                signature,
                url:
                  "https://github.com/brickman1/brickman-torrent/releases/download/v" +
                  version +
                  "/" +
                  file,
              },
            },
          };
          fs.writeFileSync("release-artifacts/latest.json", JSON.stringify(manifest, null, 2) + "\n");
          console.log(fs.readFileSync("release-artifacts/latest.json", "utf8"));
          '

      # Upload-only (`gh release upload`): the release notes written above stay
      # as they are, only the two updater files are added to the release.
      - name: Upload updater files to the release
        if: steps.updater.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "release-artifacts/Brickman Torrent_${ver}_x64-setup.exe.sig" \
            release-artifacts/latest.json \
            --clobber

