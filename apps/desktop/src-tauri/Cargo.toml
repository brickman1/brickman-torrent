[package]
name = "brickman-desktop"
description = "Brickman Torrent desktop application (Tauri + brickman-core)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "brickman_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
brickman-core.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
# "Start with Windows" switch of the settings dialog (HKCU Run key).
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# Handles a second launch (`app.exe magnet:…`): the first window gets the
# arguments and no second engine starts on the same state folder.
tauri-plugin-single-instance = "2"
tokio = { workspace = true, features = ["sync"] }
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true

[target.'cfg(windows)'.dependencies]
# Clipboard text for Ctrl+V ("paste a magnet link") and HKCU handler keys.
arboard = "3"
winreg = "0.56"
